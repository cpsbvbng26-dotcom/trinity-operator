h2 { font-size: var(--fs-lg); margin: 2.5rem 0 .75rem; }

.prose p { color: var(--text); }
.prose a, .foot a { color: inherit; text-decoration: underline; text-underline-offset: .15em; }
footer { border-top: 1px solid var(--line); margin-top: 3rem; }
.foot { display: flex; flex-wrap: wrap; gap: .3rem 1rem; padding-top: 1.5rem; padding-bottom: 2rem; font-size: var(--fs-xs); color: var(--faint); }
:where(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: .3rem; }
.skip-link { position: absolute; left: 1rem; top: -3rem; padding: .55rem 1rem; color: var(--bg); background: var(--text); font-size: var(--fs-sm); border-radius: .5rem; }
.skip-link:focus { top: 1rem; box-shadow: var(--shadow-front); }

  --gw-gold: #c9a13b;
}
.gw-band { display: block; width: 100%; }
.gw-band-ink { fill: var(--gw-ink); }
.gw-band-gold { fill: var(--gw-gold); }
.gw-orn-fill { fill: var(--accent); }
.gw-orn-long { display: block; margin: -.25rem 0 1.5rem; }
footer { border-top: 2px solid var(--gw-gold); }
@media (max-width: 30rem) {
  .head-row { flex-wrap: wrap; }
  .wrap { padding: 0 1rem; }
}
@media (prefers-reduced-motion: reduce) {

}
@media print {
  *, *::before, *::after { box-shadow: none !important; background-image: none !important; }
  .gw-band { display: none; }
  :root { --gw-gold: #000; }
}
