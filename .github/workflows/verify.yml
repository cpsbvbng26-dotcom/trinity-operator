name: 検査

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 作用素 22 項目 / 証書 51 項目 / 展望 63 項目 / 引用情報 29 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: 誤変換とバッジ記法
        run: python3 verification/check_text.py
      - name: 検査
        run: python3 check.py
      - name: 縮小になる距離の証書
        run: python3 verification/check_certificate.py
      - name: 展望の各段
        run: python3 verification/check_roadmap.py
      - name: 引用情報が名乗る数値
        run: python3 verification/check_citation.py
      - name: 実演が最後まで走るか
        run: python3 demo.py
      - name: 証書の実演が最後まで走るか
        run: python3 certificate.py
